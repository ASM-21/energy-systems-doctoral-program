name: EIA-861 historical utility coverage audit

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First EIA-861 year
        required: true
        default: "2015"
      end_year:
        description: Last EIA-861 year
        required: true
        default: "2025"
  push:
    paths:
      - "research/data-pipelines/eia861/audit_historical_coverage.py"
      - "research/data-pipelines/eia861/test_historical_coverage.py"
      - "research/data-pipelines/eia861/test_extract_ppl_eia861.py"
      - "research/data-pipelines/eia861/test_inventory_eia861.py"
      - "research/data-pipelines/eia861/extract_historical_net_metering.py"
      - "research/data-pipelines/eia861/test_historical_net_metering.py"
      - "research/data-pipelines/eia861/normalize_ppl_net_metering.py"
      - "research/data-pipelines/eia861/test_normalize_ppl_net_metering.py"
      - ".github/workflows/eia861-history-audit.yml"

permissions:
  contents: read

jobs:
  historical-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r research/data-pipelines/eia861/requirements.txt
      - name: Test coverage audit
        working-directory: research/data-pipelines/eia861
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Audit historical utility-level coverage
        run: |
          python research/data-pipelines/eia861/audit_historical_coverage.py \
            --start-year "${{ inputs.start_year || '2015' }}" \
            --end-year "${{ inputs.end_year || '2025' }}" \
            --output-dir /tmp/eia861-historical-coverage
      - name: Extract PPL historical net-metering rows
        run: |
          python research/data-pipelines/eia861/extract_historical_net_metering.py \
            --start-year "${{ inputs.start_year || '2015' }}" \
            --end-year "${{ inputs.end_year || '2025' }}" \
            --output-dir /tmp/eia861-ppl-net-metering
      - name: Harmonize PPL net-metering series
        run: |
          python research/data-pipelines/eia861/normalize_ppl_net_metering.py \
            --input-csv /tmp/eia861-ppl-net-metering/ppl_net_metering_raw.csv \
            --output-dir /tmp/eia861-ppl-net-metering/harmonized
      - name: Upload coverage and historical extraction
        uses: actions/upload-artifact@v4
        with:
          name: eia861-historical-coverage-and-extract
          path: |
            /tmp/eia861-historical-coverage/**
            /tmp/eia861-ppl-net-metering/**
