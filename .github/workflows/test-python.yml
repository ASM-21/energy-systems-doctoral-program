name: Python project tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - projects/energy-economics/merit-order-dispatch
          - projects/energy-economics/storage-arbitrage
          - projects/energy-economics/non-exporting-btm-storage
          - projects/energy-economics/stochastic-robust-capacity-planning
          - projects/policy-analysis/pa-distribution-interconnection-capstone
          - projects/policy-analysis/interconnection-queueing
          - projects/power-systems/two-node-congestion
          - projects/power-systems/three-bus-dc-power-flow
          - projects/power-systems/radial-der-hosting-capacity
          - projects/power-systems/flexible-interconnection
          - projects/power-systems/frequency-response-dynamics
          - projects/power-systems/stochastic-adequacy
          - projects/power-systems/network-flow-resilience
          - projects/econometrics/ols-energy-demand
          - projects/econometrics/competing-risks-survival
          - projects/econometrics/randomized-experiments
          - projects/econometrics/difference-in-differences
          - projects/econometrics/synthetic-control
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Run smoke test
        run: |
          if [ -f run_example.py ]; then
            python run_example.py
          elif [ -f run_capstone.py ]; then
            python run_capstone.py --output-dir /tmp/pa-interconnection-capstone
          elif [ -f capacity_planning.py ]; then
            python capacity_planning.py
          elif [ -f dispatch.py ]; then
            python dispatch.py
          elif [ -f btm_storage.py ]; then
            python btm_storage.py --power-kw 0 --energy-kwh 0 --output-dir /tmp/btm-storage-baseline
            python btm_storage.py --output-dir /tmp/btm-storage-results
          elif [ -f dc_power_flow.py ]; then
            python dc_power_flow.py
          elif [ -f feeder.py ]; then
            python feeder.py --output-dir /tmp/radial-feeder-results
            python -m py_compile benchmarks/ieee13-opendss/run_benchmark.py benchmarks/ieee13-opendss/compare_scenarios.py benchmarks/ieee13-opendss/test_compare_scenarios.py
          elif [ -f flexible_interconnection.py ]; then
            python flexible_interconnection.py --output-dir /tmp/flexible-interconnection-results
          elif [ -f frequency_response.py ]; then
            python frequency_response.py --output-dir /tmp/frequency-response-results
          elif [ -f adequacy.py ]; then
            python adequacy.py --years 2 --output-dir /tmp/stochastic-adequacy-results
          elif [ -f max_flow.py ]; then
            python max_flow.py
          elif [ -f synthetic_control.py ]; then
            python synthetic_control.py --output-dir /tmp/synthetic-control
          elif [ -f analyze.py ]; then
            python analyze.py --output /tmp/ols-lab-results
          fi

  test-casebook-analyses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Pennsylvania PUC interconnection analysis
        working-directory: research/casebooks/pa-der-interconnection
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Run PPL descriptive data-quality audit
        working-directory: research/casebooks/pa-der-interconnection
        run: python analyze_puc_interconnection.py --input-csv ppl_interconnection_2023_2025.csv --output-json /tmp/ppl_interconnection_summary.json
      - name: Run all-EDC peer comparison
        working-directory: research/casebooks/pa-der-interconnection
        run: python analyze_pa_edc_interconnection.py --input-csv pa_edc_interconnection_2023_2025.csv --output-json /tmp/pa_edc_peer_summary.json
