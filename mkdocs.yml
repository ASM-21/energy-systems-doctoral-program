site_name: Energy Systems, Infrastructure Economics & Public Policy
site_description: Independent doctoral-level curriculum in energy systems, infrastructure economics, and public policy.
site_url: https://asm-21.github.io/energy-systems-doctoral-program/
repo_url: https://github.com/ASM-21/energy-systems-doctoral-program
repo_name: ASM-21/energy-systems-doctoral-program

docs_dir: site_docs
site_dir: site
strict: true
not_in_nav: ignore

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: docs/index.md
  - Repository README: README.md
  - Program:
      - Overview: curriculum/program-overview.md
      - Roadmap: ROADMAP.md
      - Prerequisites: curriculum/prerequisites.md
      - Academic standards: ACADEMIC_STANDARDS.md
      - Departments:
          - Power systems: curriculum/departments/power-systems.md
          - Energy economics: curriculum/departments/energy-economics-markets.md
          - Regulation and policy: curriculum/departments/regulation-policy.md
          - Climate and sustainability: curriculum/departments/climate-sustainability.md
          - Quantitative methods: curriculum/departments/quantitative-methods.md
          - Infrastructure strategy: curriculum/departments/infrastructure-strategy.md
  - Curriculum:
      - Year 1: courses/year-1/README.md
      - Power systems: courses/year-1/y1-01-power-systems/README.md
      - Power systems problem set 2: courses/year-1/y1-01-power-systems/problem-set-02.md
      - Power systems solution 2: courses/year-1/y1-01-power-systems/problem-set-02-solutions.md
      - Power systems problem set: courses/year-1/y1-01-power-systems/problem-set-01.md
      - Power systems solutions: courses/year-1/y1-01-power-systems/problem-set-01-solutions.md
      - Energy economics: courses/year-1/y1-02-energy-economics/README.md
      - Energy economics problem set 2: courses/year-1/y1-02-energy-economics/problem-set-02.md
      - Energy economics solution 2: courses/year-1/y1-02-energy-economics/problem-set-02-solutions.md
      - Energy economics problem set: courses/year-1/y1-02-energy-economics/problem-set-01.md
      - Energy economics solutions: courses/year-1/y1-02-energy-economics/problem-set-01-solutions.md
      - Markets and regulation: courses/year-1/y1-03-markets-regulation-pjm/README.md
      - Markets problem set: courses/year-1/y1-03-markets-regulation-pjm/problem-set-01.md
      - Markets solutions: courses/year-1/y1-03-markets-regulation-pjm/problem-set-01-solutions.md
      - Quantitative methods: courses/year-1/y1-04-quantitative-methods/README.md
      - Quantitative methods problem set 2: courses/year-1/y1-04-quantitative-methods/problem-set-02.md
      - Quantitative methods solution 2: courses/year-1/y1-04-quantitative-methods/problem-set-02-solutions.md
      - Quantitative problem set: courses/year-1/y1-04-quantitative-methods/problem-set-01.md
      - Quantitative solutions: courses/year-1/y1-04-quantitative-methods/problem-set-01-solutions.md
      - Course references: library/course-catalog.md
  - Research:
      - Research workflow: resources/research-workflow.md
      - Data sources: resources/data-sources.md
      - Question bank: research/research-question-bank/README.md
      - Initial proposal: projects/policy-analysis/pjm-distribution-der-research-proposal.md
      - Two-node congestion lab: projects/power-systems/two-node-congestion/README.md
      - OLS energy-demand lab: projects/econometrics/ols-energy-demand/README.md
      - Merit-order dispatch lab: projects/energy-economics/merit-order-dispatch/README.md
  - Assessment: assessments/README.md
  - Progress:
      - Getting started: docs/getting-started.md
      - Repository guide: docs/repository-guide.md
      - Project index: projects/README.md
      - Tracking guide: progress/README.md
      - Transcript: progress/academic-transcript.md
