site_name: Energy Systems, Infrastructure Economics & Public Policy
site_description: Independent doctoral-level curriculum in energy systems, infrastructure economics, and public policy.
site_url: https://asm-21.github.io/energy-systems-doctoral-program/
repo_url: https://github.com/ASM-21/energy-systems-doctoral-program
repo_name: ASM-21/energy-systems-doctoral-program

docs_dir: site_docs
site_dir: site
strict: true
not_in_nav: ignore

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

